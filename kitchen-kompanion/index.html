<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Kompanion</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="device">
        <div id="inventory" class="tabcontent">
            <h1>Inventory</h1>
        </div>

        <div id="shoppinglist" class="tabcontent">
            <h1>Shopping List</h1>
        </div>

        <div id="recipes" class="tabcontent">
            <h1>Recipes</h1>
        </div>

        <div id="mealprep" class="tabcontent">
            <h1>Meal Prep</h1>
        </div>
        
        <div class="tabs">
            <button class="tablink" onclick="displayTab('inventory', this)" id="defaultOpen">
                <img src="assets/inventory.png" alt="" height="50" width="50">
                <h4>Inventory</h4>
            </button>
            <button class="tablink" onclick="displayTab('shoppinglist', this)">
                <img src="assets/shopping.png" alt="" height="50" width="50">
                <h4>Shopping List</h4>
            </button>
            <button class="tablink" onclick="displayTab('recipes', this)">
                <img src="assets/recipes.png" alt="" height="50" width="50">
                <h4>Recipes</h4>
            </button>
            <button class="tablink" onclick="displayTab('mealprep', this)">
                <img src="assets/mealprep.png" alt="" height="50" width="50">
                <h4>Meal Prep</h4>
            </button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
